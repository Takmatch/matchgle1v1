<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente del Icono -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Gradiente del Texto MATCH -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Resplandor sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- EMBLEMA CÁMARA (Lado Izquierdo) -->
  <g transform="translate(6, 12)">
    <!-- Cuerpo de la cámara -->
    <rect x="0" y="16" width="60" height="52" rx="15" fill="url(#brandGrad)" filter="url(#glow)" opacity="0.35" />
    <rect x="0" y="16" width="60" height="52" rx="15" fill="url(#brandGrad)" />
    
    <!-- Lente central -->
    <circle cx="30" cy="42" r="14" fill="#07090E" />
    <circle cx="30" cy="42" r="8" fill="url(#brandGrad)" />
    <circle cx="33" cy="39" r="2.8" fill="#FFFFFF" opacity="0.9" />

    <!-- Lente triángulo objetivo -->
    <path d="M 60 30 L 80 17 C 83 15 86 17 86 21 L 86 63 C 86 67 83 69 80 67 L 60 54 Z" fill="url(#brandGrad)" />

    <!-- Chispa de brillo superior -->
    <path d="M 18 6 Q 18 16 28 16 Q 18 16 18 26 Q 18 16 8 16 Q 18 16 18 6 Z" fill="#FBBF24" />
  </g>

  <!-- TEXTO INTEGRADO (TALK + MATCH) -->
  <text x="110" y="67" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
    <tspan fill="#FFFFFF">TALK</tspan><tspan fill="url(#textGrad)">MATCH</tspan>
  </text>

  <!-- BADGE 1v1 -->
  <g transform="translate(470, 34)">
    <rect x="0" y="0" width="58" height="30" rx="9" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="1.8" stroke-opacity="0.5" />
    <text x="29" y="20.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="0.5">1v1</text>
  </g>
</svg>
